name: Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and redeploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/kasb-kompas/career-compass-backend && git pull
            cd ~/kasb-kompas/career-compass-frontend && git pull
            cd ~/kasb-kompas/career-compass-backend/deploy && docker compose up -d --build
